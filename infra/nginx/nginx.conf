worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  client_max_body_size 32m;   # arquivos de importação do ERP
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$uri","s":$status,"ms":$request_time}';
  access_log /var/log/nginx/access.log json;

  limit_req_zone $binary_remote_addr zone=otp:10m rate=10r/m;

  upstream api { server api:3001; }
  upstream web { server web:3000; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/clube.crt;
    ssl_certificate_key /etc/nginx/certs/clube.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # OTP: limite por IP contra abuso de envio de SMS/WhatsApp
    location ~ ^/api/(auth/participante/otp|participantes/adesao/otp|caixa/otp)$ {
      limit_req zone=otp burst=5 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
