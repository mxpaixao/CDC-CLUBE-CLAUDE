name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cdc
          POSTGRES_PASSWORD: cdc
          POSTGRES_DB: clube_cdc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cdc" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://cdc:cdc@localhost:5432/clube_cdc_test?schema=public
      DATABASE_URL_TEST: postgresql://cdc:cdc@localhost:5432/clube_cdc_test?schema=public
      DATABASE_URL_E2E: postgresql://cdc:cdc@localhost:5432/clube_cdc_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint e formatação
        run: pnpm lint && pnpm format:check
      - name: Build (libs, API, web)
        run: pnpm build:libs && pnpm --filter @cdc/api build && pnpm --filter @cdc/web build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Motor de regras (cobertura mínima 90%)
        run: pnpm --filter @cdc/shared test && pnpm --filter @cdc/rules test
      - name: API (integração com Postgres)
        run: pnpm --filter @cdc/api test
      - name: E2E (Playwright)
        run: |
          PGPASSWORD=cdc psql -h localhost -U cdc -d postgres -c "CREATE DATABASE clube_cdc_e2e"
          pnpm --filter @cdc/e2e exec playwright install --with-deps chromium
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
